server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: event-tracking-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/event_tracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: ${APP_LOG_LEVEL:INFO}
    com.enriqueibarraig: ${APP_LOG_LEVEL:INFO}